name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build universal Mac app
        run: bash build.sh
      - name: Test encoding, search, and highlighting
        run: build/Greenpad.app/Contents/MacOS/Greenpad --self-test
      - name: Test native editing, tabs, saving, and undo
        run: build/Greenpad.app/Contents/MacOS/Greenpad --ui-test
      - name: Verify app signature and architectures
        run: |
          codesign --verify --deep --strict build/Greenpad.app
          xcrun lipo build/Greenpad.app/Contents/MacOS/Greenpad -verify_arch arm64
          xcrun lipo build/Greenpad.app/Contents/MacOS/Greenpad -verify_arch x86_64
